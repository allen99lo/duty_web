{% extends "base.html" %}
{% block title %}排班表系統 - 首頁{% endblock %}
{% block content %}
<div class="card">
    <h1 class="card-title">桃園裝修區臺 排班表系統</h1>
    <div class="stat-row">
        <div class="stat-box">
            <div class="stat-value" id="totalDays">-</div>
            <div class="stat-label">排班天數</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="totalEmp">-</div>
            <div class="stat-label">員工數</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="totalShifts">-</div>
            <div class="stat-label">總班次</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="monthLabel">-</div>
            <div class="stat-label">月份</div>
        </div>
    </div>
</div>

<div class="card">
    <h2 class="card-title">班別圖例</h2>
    <div class="legend" id="legend"></div>
</div>

<div class="card">
    <h2 class="card-title">員工概覽</h2>
    <div class="emp-grid" id="empGrid"></div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='index.js') }}"></script>
{% endblock %}
